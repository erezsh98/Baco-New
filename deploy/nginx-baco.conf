# BACO — native-VM reverse proxy for baco.co.il
# Put at /etc/nginx/sites-available/baco.conf and symlink into sites-enabled.

# Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name baco.co.il www.baco.co.il;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name baco.co.il www.baco.co.il;

    # TLS (see certbot step in the runbook)
    ssl_certificate     /etc/letsencrypt/live/baco.co.il/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baco.co.il/privkey.pem;

    client_max_body_size 20m;

    # Pelecard server-to-server callbacks (goodUrl / errorUrl / ValidateLink) are
    # https://baco.co.il/payment/... and are hit outside the browser, so they must
    # reach FastAPI directly — Next.js has no /payment route.
    location /payment/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # External scheduler (Cloud Scheduler) → FastAPI /jobs/* directly.
    # Only needed if you drive the jobs externally (ENABLE_SCHEDULER=false).
    location /jobs/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → Next.js. The browser calls /api/backend/* and Next rewrites
    # those to the backend itself (BACKEND_URL), so no extra nginx rule is needed.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
